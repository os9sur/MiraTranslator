<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mira Credit</title>

    <script src="i18n.js"></script>
    <script src="utils.js"></script>
    <style>
        :root {
  --bg: #080b11;
  --surface: #111827;
  --surface2: #1a2336;
  --surface3: #1f2d44;
  --border: rgba(255,255,255,0.10);
  --border-active: #4e8ef7;
  --text: #ffffff;
  --text-muted: #94b4d8;
  --text-dim: #5a7099;
  --blue: #5c9aff;
  --blue-bright: #7bb0ff;
  --blue-dim: rgba(92,154,255,0.13);
  --radius: 20px;
  --radius-sm: 14px;
  --font-cn: -apple-system, 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', sans-serif;
  --font-en: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-cn);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 32px 24px;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  top: -200px; left: -200px;
  width: 900px; height: 900px;
  background: radial-gradient(circle, rgba(92,154,255,0.10) 0%, transparent 65%);
  pointer-events: none;
  z-index: 0;
}
body::after {
  content: '';
  position: fixed;
  bottom: -200px; right: -200px;
  width: 700px; height: 700px;
  background: radial-gradient(circle, rgba(157,124,216,0.08) 0%, transparent 65%);
  pointer-events: none;
  z-index: 0;
}

.card {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 780px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 32px;
  overflow: hidden;
  box-shadow: 0 40px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.03);
  animation: fadeUp 0.5s cubic-bezier(0.16,1,0.3,1) both;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(28px) scale(0.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.header {
  padding: 32px 40px 28px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 20px;
}

.logo-fallback {
  width: 60px; height: 60px;
  border-radius: 50%;
  background: var(--surface2);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  box-shadow: inset 0 2px 6px rgba(0,0,0,0.3);
  font-size: 26px;
}

.header-info {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.header-title {
  font-size: 22px;
  font-weight: 800;
  font-family: var(--font-en);
  letter-spacing: -0.3px;
}

.header-sub {
  font-size: 16px;
  color: var(--text-muted);
  margin: 10px 0 0 21px;
}

.header-back {
  margin-left: auto;
  width: 40px; height: 40px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: rgba(255,255,255,0.03);
  color: var(--text-muted);
  cursor: pointer;
  font-size: 18px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
  flex-shrink: 0;
  font-family: var(--font-cn);
}
.header-back:hover {
  border-color: var(--border-active);
  color: var(--text);
  background: var(--blue-dim);
}

.account {
  margin: 28px 40px 0;
  background: var(--surface2);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: var(--radius);
  padding: 22px 28px;
  display: none;
  align-items: center;
  gap: 20px;
}
.account.show {
  display: flex;
}

.acc-avatar {
  width: 56px; height: 56px;
  border-radius: 50%;
  background: linear-gradient(135deg, #2d4a80, #1e3560);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; font-weight: 700;
  color: #7aabee;
  flex-shrink: 0;
  overflow: hidden;
  box-shadow: 0 6px 14px rgba(0,0,0,0.35);
}
.acc-avatar img {
  width: 100%; height: 100%;
  object-fit: cover;
  border-radius: 50%;
}

.acc-info { flex: 1; min-width: 0; }

.acc-name {
  font-size: 17px; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  letter-spacing: 0.3px;
}
.acc-email {
  font-size: 13px;
  color: var(--text-muted);
  margin-top: 5px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.acc-balance {
  text-align: right;
  flex-shrink: 0;
}
.bal-label {
  font-size: 12px;
  color: var(--text-muted);
  margin-bottom: 6px;
  display: block;
}
.bal-val {
  font-size: 28px; font-weight: 800;
  color: var(--blue-bright);
  font-family: var(--font-en);
  line-height: 1;
}

.not-logged {
  margin: 28px 40px 0;
  background: rgba(255,180,0,0.08);
  border: 1px solid rgba(255,180,0,0.3);
  border-radius: var(--radius);
  padding: 20px 24px;
  display: none;
  align-items: center;
  gap: 16px;
}
.not-logged.show {
  display: flex;
}
.not-logged-icon {
  width: 48px; height: 48px;
  border-radius: 50%;
  background: rgba(255,180,0,0.15);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.not-logged p {
  font-size: 14px;
  color: #e6c387;
}
.not-logged a {
  font-size: 14px;
  color: #ffb400;
  text-decoration: underline;
  cursor: pointer;
  font-weight: 600;
}

.switcher {
  display: flex;
  gap: 12px;
  margin: 28px 40px 0;
}
.sw-btn {
  flex: 1;
  padding: 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: rgba(255,255,255,0.02);
  color: var(--text-muted);
  font-size: 14px; font-weight: 500;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  gap: 8px;
  transition: all 0.2s;
  font-family: var(--font-cn);
}
.sw-btn:hover { background: rgba(255,255,255,0.06); }
.sw-btn.active {
  background: var(--blue-dim);
  border-color: var(--blue);
  color: var(--blue-bright);
  box-shadow: inset 0 0 0 1px rgba(92,154,255,0.2);
}

.divider {
  height: 1px;
  background: var(--border);
  margin: 28px 40px 0;
}

.panel {
  display: none;
  padding: 32px 40px 36px;
}
.panel.active {
  display: block;
}

.sec-label {
  font-size: 12px;
  color: var(--text-dim);
  letter-spacing: 1.2px;
  text-transform: uppercase;
  margin-bottom: 22px;
  font-weight: 700;
}

.plans {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 16px;
  margin-bottom: 28px;
}

.plan-card {
  position: relative;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface2);
  padding: 36px 16px 28px;
  text-align: center;
  cursor: pointer;
  transition: all 0.28s cubic-bezier(0.16,1,0.3,1);
  text-decoration: none;
  display: flex; flex-direction: column;
  color: inherit;
}
.plan-card:hover {
  border-color: var(--blue);
  transform: translateY(-6px);
  box-shadow: 0 16px 32px rgba(0,0,0,0.35);
  background: rgba(92,154,255,0.06);
}
.plan-card.featured {
  border-color: var(--blue);
  background: linear-gradient(180deg, rgba(92,154,255,0.14) 0%, rgba(92,154,255,0.04) 100%);
  box-shadow: 0 0 0 1px var(--blue), 0 10px 30px rgba(92,154,255,0.18);
}
.plan-card.featured:hover {
  box-shadow: 0 0 0 1px var(--blue), 0 18px 40px rgba(92,154,255,0.28);
}

.plan-badge {
  position: absolute;
  top: -14px; left: 50%;
  transform: translateX(-50%);
  background: linear-gradient(90deg, #4e8ef7, #3b76d9);
  color: #fff;
  font-size: 12px;
  padding: 5px 18px;
  border-radius: 14px;
  white-space: nowrap;
  font-weight: 700;
  box-shadow: 0 6px 14px rgba(78,142,247,0.45);
  font-family: var(--font-cn);
}

.plan-name {
  font-size: 15px;
  color: var(--text-muted);
  margin-bottom: 14px;
  font-family: var(--font-en);
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.8px;
}

.plan-price {
  font-size: 52px;
  font-weight: 800;
  color: #fff;
  font-family: var(--font-en);
  line-height: 1;
  text-shadow: 0 4px 12px rgba(0,0,0,0.3);
}

.plan-unit {
  font-size: 14px;
  color: var(--text-muted);
  margin-top: 10px;
  line-height: 1.6;
}

.plan-arrow {
  margin-top: 18px;
  font-size: 14px;
  color: var(--text-dim);
  transition: all 0.2s;
  font-weight: 600;
}
.plan-card:hover .plan-arrow {
  color: var(--blue-bright);
  transform: translateX(3px);
}

.notice {
  background: rgba(92,154,255,0.06);
  border: 1px solid rgba(92,154,255,0.14);
  border-radius: var(--radius-sm);
  padding: 20px 24px;
  font-size: 14px;
  color: var(--text-muted);
  line-height: 1.7;
}
.notice b {
  color: var(--blue-bright);
  font-weight: 600;
}

.footer {
  padding: 0 40px 32px;
  display: flex;
  justify-content: center;
  gap: 32px;
}
.flink {
  font-size: 14px;
  color: var(--text-dim);
  cursor: pointer;
  transition: color 0.2s;
  font-weight: 500;
}
.flink:hover { color: var(--text); }

@media (max-width: 600px) {
  body { padding: 0; align-items: flex-start; }
  .card { border-radius: 0; max-width: 100%; min-height: 100vh; border: none; box-shadow: none; }
  .header { padding: 24px 20px 20px; }
  .account, .not-logged, .divider, .switcher { margin-left: 20px; margin-right: 20px; }
  .panel { padding: 24px 20px 28px; }
  .footer { padding: 0 20px 28px; }
  .plans { grid-template-columns: 1fr; }
  .plan-card { padding: 20px 16px; flex-direction: row; align-items: center; text-align: left; }
  .plan-badge { top: -10px; left: 16px; transform: none; }
  .plan-name { margin-bottom: 0; width: 80px; }
  .plan-price { font-size: 32px; flex: 1; text-align: center; }
  .plan-unit { margin-top: 0; margin-left: 8px; }
  .plan-arrow { margin-top: 0; margin-left: auto; }
}
    </style>
</head>

<body>
    <div class="card">

        <!-- Header -->
        <div class="header">
            <div class="logo-fallback"><img src="/icons/icon-128.png"
                    style="width: 100%; height: 100%; object-fit: contain;" /></div>
            <div>
                <h2 style="margin:0; display:flex; align-items:center; gap:8px; 
                            background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%); 
                            -webkit-background-clip: text; 
                            background-clip: text; 
                            -webkit-text-fill-color: transparent; 
                            font-weight: 800; 
                            letter-spacing: -0.2px;">

                    <span
                        style="-webkit-text-fill-color: #fbbf24; text-shadow: 0 0 8px rgba(251, 191, 36, 0.6);">✦</span>
                    Mira AI Translator

                    <span style="background: linear-gradient(135deg, #f59e0b, #d97706); 
                                        -webkit-text-fill-color: #fff; 
                                        color: #fff; 
                                        font-size: 11px; 
                                        padding: 2px 8px; 
                                        border-radius: 10px; 
                                        font-weight: 600; 
                                        margin-left: 2px;
                                        box-shadow: 0 2px 6px rgba(217, 119, 6, 0.3);">
                        Pro
                    </span>
                </h2>
                <div class="header-sub" data-i18n="recharge">充值</div>
            </div>
            <button class="header-back" id="goBack">×</button>
        </div>

        <div class="not-logged" id="notLoggedBox">
            <div class="not-logged-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                    <circle cx="12" cy="8" r="4" stroke="#f0c040" stroke-width="1.5" />
                    <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" stroke="#f0c040" stroke-width="1.5" stroke-linecap="round" />
                </svg>
            </div>
            <div>
                <p data-i18n="loginFirst">请先登录 Google 账号后再充值</p>
                <a id="triggerLogin" data-i18n="login">点此登录 →</a>
            </div>
        </div>

        <div class="account" id="accountBox">
            <div class="acc-avatar" id="userAvatar">--</div>
            <div class="acc-info">
                <div class="acc-name" id="userName">—</div>
                <div class="acc-email" id="userEmail">—</div>
            </div>
            <div class="acc-balance">
                <div class="bal-label" data-i18n="balance">当前余额</div>
                <div class="bal-val" id="balanceVal">$0.00</div>
            </div>
        </div>

        <div class="divider"></div>

        <div class="panel" id="panelKofi" style="display:block;">
            <div class="sec-label" data-i18n="selectPlan">选择充值金额</div>
            <div class="plans">
                <a class="plan-card" data-url="https://ko-fi.com/s/079b533b66">
                    <div class="plan-name" data-i18n="recharge">Top-up</div>
                    <div class="plan-price"><span style="font-size:0.5em;vertical-align:super;">$</span>5</div>
                    <div class="plan-unit" data-i18n="PAYG">Pay as you go</div>
                    <div class="plan-unit" data-i18n="expired">Credits valid for 1 year</div>
                </a>
                <a class="plan-card featured" data-url="https://ko-fi.com/s/541f4e2a84">
                    <div class="plan-badge" data-i18n="recommended">推荐</div>
                    <div class="plan-name" data-i18n="recharge">Top-up</div>
                    <div class="plan-price"><span style="font-size:0.5em;vertical-align:super;">$</span>10</div>
                    <div class="plan-unit" data-i18n="PAYG">Pay as you go</div>
                    <div class="plan-unit" data-i18n="expired">Credits valid for 1 year</div>
                </a>
                <a class="plan-card" data-url="https://ko-fi.com/s/6a3ee2d2b7">
                    <div class="plan-name" data-i18n="recharge">Top-up</div>
                    <div class="plan-price"><span style="font-size:0.5em;vertical-align:super;">$</span>15</div>
                    <div class="plan-unit" data-i18n="PAYG">Pay as you go</div>
                    <div class="plan-unit" data-i18n="expired">Credits valid for 1 year</div>
                </a>
            </div>
            <div class="notice" data-i18n="paymentNotice" data-i18n-type="html">
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <span class="flink" id="openSupport" data-i18n="notArrived">充值未到账？</span>
        </div>

    </div>
    <script src="recharge.js"></script>
</body>

</html>
