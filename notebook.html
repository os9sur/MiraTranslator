<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="i18n.js"></script>
  <title>Mira-Vocabulary</title>
  <style>
    body {
      background: #020617;
      color: #e5e7eb;
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 40px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 1250px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .search-bar-wrapper {
      flex: 1;
      max-width: 485px;
      position: relative;
      margin-bottom: 0;
      display: inline-block;
      border-radius: 999px;
      transition: box-shadow 0.2s ease;
      box-shadow: 0 0 6px rgba(56, 189, 248, 0.4), 0 0 16px rgba(56, 189, 248, 0.15);
    }

    .search-bar-wrapper:hover,
    .search-bar-wrapper:focus-within {
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.6), 0 0 20px rgba(56, 189, 248, 0.3);
    }

    .highlight-label {
      border: 1.2px solid rgba(21, 155, 226, 0.5);
      border-radius: 999px;
      padding: 8px 25px;
      gap: 12px;
      box-shadow: 0 0 6px rgba(34, 197, 94, 0.3), 0 0 16px rgba(34, 197, 94, 0.1);
    }

    .highlight-label:hover {
      box-shadow: 0 0 8px rgba(34, 197, 94, 0.5), 0 0 20px rgba(34, 197, 94, 0.2);
    }

    .search-bar-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      pointer-events: none;
    }

    .search-bar-input {
      width: 100%;
      background: rgb(23 40 81 / 64%);
      border: 1.2px solid rgba(56, 189, 248, 0.5);
      color: white;
      padding: 10px 16px 10px 42px;
      border-radius: 999px;
      font-size: 14px;
      outline: none;
      box-sizing: border-box;
    }

    .search-bar-input:focus {
      border-color: #38bdf8;
      background: #020617;
      outline: 2px solid rgba(56, 189, 248, 0.3);
      outline-offset: 0px;
    }

    .context-speaker-btn,
    .example-speaker-btn {
      transition: color 0.2s;
    }

    .context-speaker-btn:hover,
    .example-speaker-btn:hover {
      color: #38bdf8 !important;
    }

    .context-speaker-btn svg,
    .example-speaker-btn svg {
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      transform-origin: center;
    }

    .context-speaker-btn:hover svg,
    .example-speaker-btn:hover svg {
      transform: scale(1.25);
    }

    .btn {
      padding: 8px 16px;
      border-radius: 28px;
      border: none;
      cursor: pointer;
      font-weight: 500;
      white-space: nowrap;
      position: relative;
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --glow-color: rgba(56, 189, 248, 0.6);
      --glow-spread: rgba(56, 189, 248, 0.3);
      transition: box-shadow 0.2s ease, transform 0.15s ease;
    }

    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 8px var(--glow-color), 0 0 20px var(--glow-spread);
    }

    .btn:active {
      transform: scale(0.98);
      filter: brightness(0.95);
    }

    .btn-primary {
      background: #38bdf8;
      color: #000;
    }

    .btn-danger {
      --glow-color: rgba(239, 68, 68, 0.6);
      --glow-spread: rgba(239, 68, 68, 0.3);
      background: #ef4444;
      color: white;
      padding: 4px 8px;
      font-size: 12px;
    }

    .btn-export {
      background: #127538;
      color: white;
    }

    .add-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(235, 234, 234, 0.11);
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    input {
      background: #020617;
      border: 1px solid #334155;
      color: white;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }

    input:focus {
      border-color: #38bdf8;
    }

    #wordInp {
      flex: 0.382 1 0;
    }

    #transInp {
      flex: 0.618 1 0;
      resize: none;
      overflow: hidden;
      background: #020617;
      border: 1px solid #334155;
      color: white;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      font-family: system-ui, -apple-system, sans-serif;
      box-sizing: border-box;
      appearance: none;
      -webkit-appearance: none;
      margin: 0;
      height: 40px;
      min-height: 40px;
    }

    #wordInp,
    #transInp {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    #wordInp:focus,
    #transInp:focus {
      border-color: rgba(56, 189, 248, 0.5);
      background: rgba(56, 189, 248, 0.04);
      outline: none;
    }

    /* ── 桌面端 grid 表格 ── */
    .table-container {
      background: #1e293b;
      border-radius: 12px;
      box-shadow:
        0 25px 50px -12px rgba(0, 0, 0, 0.7),
        0 0 40px rgba(56, 189, 248, 0.3),
        0 0 80px rgba(56, 189, 248, 0.1),
        inset 0 0 15px rgba(56, 189, 248, 0.15);
      overflow: hidden;
      margin-top: 20px;
      margin-bottom: 50px;
    }

    #vocabTable {
      width: 100%;
    }

    .vocab-head {
      display: grid;
      grid-template-columns: 220px 1fr 130px 160px 110px 105px;
      background: rgba(30, 41, 59, 0.8);
      border-bottom: 1px solid rgba(56, 189, 248, 0.2);
      padding: 0 8px;
    }

    .vocab-head>div {
      padding: 12px 8px;
      color: #94a3b8;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .vocab-row {
      display: grid;
      grid-template-columns: 220px 1fr 130px 160px 110px 105px;
      border-bottom: 1px solid #1e293b;
      padding: 0 8px;
      transition: background-color 0.2s;
    }

    .vocab-row:nth-child(odd) {
      background: rgba(10, 12, 18, 0.2);
    }

    .vocab-row:hover {
      background: rgba(10, 12, 18, 0.5);
    }

    .vocab-row:last-child {
      border-bottom: none;
    }

    .vocab-cell {
      padding: 12px 8px;
      word-break: break-word;
      overflow-wrap: break-word;
      white-space: normal;
      min-width: 0;
    }

    /* 备注列宽度限制 */
    .vocab-cell:nth-child(3) {
      max-width: 130px;
      word-break: break-all;
    }

    .note-empty {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: #9eafc6;
      font-size: 12px;
      cursor: pointer;
      border: 1px dashed #41723e;
      border-radius: 4px;
      padding: 2px 8px;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .note-empty:hover {
      border-color: #38bdf8;
      color: #38bdf8;
    }

    .source-wrapper {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .source-link {
      color: #38bdf8;
      font-size: 12px;
      text-decoration: none;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .source-link:hover {
      text-decoration: underline;
    }

    .source-title {
      color: #64748b;
      font-size: 10px;
      line-height: 1.3;
      overflow: hidden;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 6;
      line-clamp: 6;
      word-break: keep-all;
    }

    #pagination {
      margin-top: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
    }

    .word-text {
      font-weight: 600;
      color: #38bdf8;
      font-size: 15px;
      margin-right: 6px;
    }

    .speaker-icon {
      cursor: pointer;
      color: #64748b;
      transition: color 0.2s;
      display: inline-flex;
      vertical-align: middle;
    }

    .speaker-icon:hover {
      color: #38bdf8;
    }

    .undo-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px dashed #ef4444;
      border-radius: 28px;
      padding: 4px;
      width: 85px;
      box-sizing: border-box;
    }

    .delete-countdown {
      color: #ef4444;
      font-size: 11px;
      font-weight: bold;
      font-family: monospace;
    }

    .undo-link {
      color: #38bdf8 !important;
      font-size: 11px;
      font-weight: bold;
      text-decoration: underline !important;
      cursor: pointer;
    }

    .row-fade-out {
      opacity: 0;
      transform: translateX(20px);
      transition: all 0.4s ease-out;
    }

    @keyframes tts-loading-spin {
      to {
        transform: rotate(360deg);
      }
    }

    .tts-loading {
      position: relative;
    }

    .tts-loading::before {
      content: "";
      position: absolute;
      top: 0;
      left: -3px;
      right: 0;
      bottom: 0;
      margin: auto;
      width: 14px;
      height: 14px;
      border: 1.5px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      pointer-events: none;
      animation: tts-loading-spin 0.7s linear infinite;
    }

    .tts-loading svg {
      opacity: 0.3;
    }

    .speaker-btn:hover {
      color: #38bdf8 !important;
      transform: scale(1.1);
    }

    .speaker-btn.speaking {
      color: #38bdf8 !important;
      animation: pulse-ring 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes pulse-ring {
      0% {
        transform: scale(1);
        opacity: 1;
      }

      50% {
        transform: scale(1.2);
        opacity: 0.7;
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .speaker-btn.speaking svg path {
      stroke-dasharray: 10;
      animation: wave-offset 0.5s linear infinite;
    }

    @keyframes wave-offset {
      from {
        stroke-dashoffset: 20;
      }

      to {
        stroke-dashoffset: 0;
      }
    }

    /* RTL */
    html[lang="ar"] .source-wrapper,
    html[lang="fa"] .source-wrapper {
      align-items: flex-end;
    }

    html[lang="ar"] .vocab-row,
    html[lang="fa"] .vocab-row,
    html[lang="ar"] .vocab-head,
    html[lang="fa"] .vocab-head {
      direction: rtl;
    }

    html[lang="ar"] .vocab-head>div,
    html[lang="fa"] .vocab-head>div {
      text-align: right;
    }

    html[lang="ar"] .search-bar-icon,
    html[lang="fa"] .search-bar-icon {
      left: auto;
      right: 16px;
    }

    html[lang="ar"] .search-bar-input,
    html[lang="fa"] .search-bar-input {
      padding: 10px 42px 10px 16px;
    }

    html[lang="ar"] .btn:not(#pagination .btn),
    html[lang="ar"] .add-box button,
    html[lang="ar"] input:not(#pagination input),
    html[lang="ar"] #searchInp,
    html[lang="fa"] .btn:not(#pagination .btn),
    html[lang="fa"] .add-box button,
    html[lang="fa"] input:not(#pagination input),
    html[lang="fa"] #searchInp {
      direction: rtl !important;
      unicode-bidi: isolate;
    }

    #pagination,
    #pagination .btn,
    #pagination input {
      direction: ltr !important;
      unicode-bidi: isolate;
    }

    /* ── 移动端 ── */
    @media (max-width: 768px) {
      body {
        padding: 12px 12px 20px 12px;
      }

      #syncStatus {
        align-self: flex-start;
      }

      .header {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }

      div[dir="auto"]:has(.search-bar-wrapper) {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
      }

      .search-bar-wrapper {
        flex: 1 !important;
        width: 90% !important;
        max-width: 100% !important;
      }

      .highlight-label {
        align-self: center;
        padding: 5px 16px;
      }

      .add-box {
        flex-direction: column;
        align-items: stretch;
      }

      #wordInp,
      #transInp {
        width: 100%;
        flex: none;
        box-sizing: border-box;
      }

      .table-container {
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5), 0 0 16px rgba(56, 189, 248, 0.15);
        border-radius: 10px;
        margin-top: 12px;
        margin-bottom: 24px;
      }

      /* 隐藏表头 */
      .vocab-head {
        display: none;
      }

      /* 每行变卡片 */
      .vocab-row {
        display: block;
        position: relative;
        background: transparent !important;
        padding: 12px;
        margin: 0;
        border-bottom: none;
      }

      .vocab-row::after {
        content: "";
        position: absolute;
        bottom: 0;
        left: 15px;
        right: 15px;
        height: 1px;
        background-image: linear-gradient(to right, rgb(39 255 98 / 36%) 50%, transparent 50%);
        background-size: 6px 1px;
        background-repeat: repeat-x;
      }

      /* 最后一个不显示 */
      .vocab-row:last-child::after {
        display: none;
      }

      .vocab-row:hover {
        background: rgba(56, 189, 248, 0.03) !important;
      }

      .vocab-row:last-child {
        border-bottom: none;
      }

      .vocab-cell {
        display: block;
        width: 100%;
        max-width: 100%;
        padding: 2px 0;
        min-width: 0;
        word-break: break-word;
        overflow-wrap: break-word;
        white-space: normal;
        box-sizing: border-box;
      }

      /* 备注列宽度不限制 */
      .vocab-cell:nth-child(3) {
        max-width: 100%;
        word-break: break-word;
      }

      /* 单词列 */
      /* .vocab-cell:nth-child(1) { padding-right: 55px; } */

      /* 释义列 */
      .vocab-cell:nth-child(2) {
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid rgba(255, 255, 255, 0.06);
      }

      .vocab-cell:nth-child(2)::before {
        content: var(--label-meaning, "释义");
        display: block;
        font-size: 10px;
        color: #5f718b;
        letter-spacing: 0.08em;
        margin-bottom: 4px;
      }

      .vocab-cell:nth-child(2) * {
        word-break: break-word;
        white-space: normal;
        overflow-wrap: break-word;
      }

      /* 备注列 */
      .vocab-cell:nth-child(3)::before {
        content: var(--label-note, "备注");
        display: block;
        font-size: 10px;
        color: #5f718b;
        letter-spacing: 0.08em;
        margin-top: 8px;
        margin-bottom: 4px;
      }

      .vocab-cell:nth-child(3) .note-empty {
        margin-top: 8px;
        font-size: 11px;
      }

      /* 来源列 */
      .vocab-cell:nth-child(4)::before {
        content: var(--label-source, "来源");
        display: block;
        font-size: 10px;
        color: #5f718b;
        letter-spacing: 0.08em;
        margin-top: 8px;
        margin-bottom: 4px;
      }

      /* 时间列：移动端隐藏 */
      .vocab-cell:nth-child(5) {
        display: none;
      }

      /* 操作列：右上角绝对定位 */
      .vocab-cell:nth-child(6) {
        position: absolute;
        top: 12px;
        right: 12px;
        width: auto;
        padding: 0;
      }

      .btn-danger {
        padding: 3px 8px !important;
        font-size: 11px !important;
      }

      .undo-container {
        width: auto;
        min-width: 70px;
      }

      .source-link {
        white-space: normal;
        word-break: break-all;
      }

      .source-title {
        -webkit-line-clamp: 3;
        line-clamp: 3;
      }
    }

    .nb-sync-btn {
      display: inline-flex;
      position: relative;
      overflow: hidden;
    }

    .nb-sync-btn .btn-label {
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .nb-sync-btn .sync-log-scroller {
      position: absolute;
      top: 100%;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: top 0.3s ease;
      pointer-events: none;
    }

    .nb-sync-btn.syncing .btn-label {
      transform: translateY(-30px);
      opacity: 0;
    }

    .nb-sync-btn.syncing .sync-log-scroller {
      top: 0;
    }

    .nb-sync-btn.syncing .sync-log-scroller::after {
      content: "";
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: nb-spin 0.7s linear infinite;
    }

    @keyframes nb-spin {
      to {
        transform: rotate(360deg);
      }
    }

    .nb-sync-btn:disabled,
    .nb-sync-btn.syncing {
      cursor: wait;
      filter: saturate(0.8);
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div class="container">
    <div dir="auto" class="header">
      <h1 style="font-size: 24px; margin: 0;" data-i18n="myWordBook">📓 我的生词本</h1>
      <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px;">
        <div style="display: flex; gap: 6px; align-items: center; flex-wrap: nowrap;">
          <button id="nbSyncPush" class="btn nb-sync-btn"
            style="background:#127538; color:white; position:relative; overflow:hidden; padding:6px 10px; font-size:12px;">
            <span class="btn-label" data-i18n="backupToCloud">备份至云端 ↑</span>
            <div class="sync-log-scroller"></div>
          </button>
          <button id="nbSyncPull" class="btn nb-sync-btn"
            style="background:rgba(16,185,129,0.1); border:1.5px solid #10b981; color:#10b981; position:relative; overflow:hidden; padding:5px 10px; font-size:12px;">
            <span class="btn-label" data-i18n="restoreFromCloud">从云端恢复 ↓</span>
            <div class="sync-log-scroller"></div>
          </button>
          <button id="exportBtn" class="btn btn-export" style="padding:6px 18px; font-size:12px;"
            data-i18n="exportCSV">导出 CSV</button>
        </div>
        <span id="syncStatus" style="font-size: 11px; color: #475569;"></span>
      </div>
    </div>

    <div class="add-box" dir="auto">
      <input type="text" id="wordInp" data-i18n="word" data-i18n-type="placeholder" placeholder="New word...">
      <textarea id="transInp" data-i18n="meaning" data-i18n-type="placeholder" placeholder="Meaning..." rows="1"
        style="resize: none; overflow: hidden; transition: height 0.2s; field-sizing: content;"></textarea>
      <button id="addBtn" class="btn btn-primary" data-i18n="manualAdd">手动添加</button>
    </div>

    <div dir="auto"
      style="display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:12px;">
      <div class="search-bar-wrapper" style="margin-bottom:0;">
        <span class="search-bar-icon">🔍</span>
        <input type="text" id="searchInp" class="search-bar-input" data-i18n="searchVocabulary"
          data-i18n-type="placeholder" placeholder="Search vocabulary...">
      </div>
      <label class="highlight-label"
        style="display:flex;align-items:center;gap:12px;cursor:pointer;white-space:nowrap;flex-shrink:0;">
        <span style="color:#94a3b8; font-size:14px;" data-i18n="highlightVocab">在网页高亮生词</span>
        <div id="highlightToggle"
          style="width:36px;height:20px;border-radius:999px;background:#334155;cursor:pointer;position:relative;transition:background 0.2s;">
          <div id="highlightThumb"
            style="width:16px;height:16px;border-radius:50%;background:white;position:absolute;top:2px;left:2px;transition:left 0.2s;">
          </div>
        </div>
      </label>
    </div>

    <div class="table-container">
      <div id="vocabTable">
        <div class="vocab-head">
          <div data-i18n="word">单词/句子</div>
          <div data-i18n="meaning">释义</div>
          <div data-i18n="note">备注</div>
          <div data-i18n="source">来源</div>
          <div data-i18n="addTime">时间</div>
          <div data-i18n="operation">操作</div>
        </div>
        <div id="vocabBody"></div>
      </div>
    </div>

    <div id="pagination" style="direction: ltr; unicode-bidi: isolate;">
      <button id="prevPage" class="btn" style="background: #334155; color: white;">&lt;</button>
      <span id="pageInfo" style="font-size: 14px; color: #94a3b8; font-family: monospace;">Page 1 / 1</span>
      <input id="jumpInp" type="number" min="1" placeholder="Go..." style="width:60px; background:#0f172a; border:1px solid #334155;
         color:#fff; border-radius:6px; padding:4px 8px; font-size:13px; text-align:center; outline:none;">
      <button id="nextPage" class="btn" style="background: #334155; color: white;">&gt;</button>
    </div>
    <div style="
                text-align: center;
                margin-top: 10px; 
                font-size: 11px;
                color: #334155;
                letter-spacing: 0.05em;
                ">
      Created by David Bai
    </div>
  </div>
  <script src="utils.js"></script>
  <script src="notebook.js"></script>
</body>

</html>
