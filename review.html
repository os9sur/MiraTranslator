<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enjoying Mira?</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0f0f13;
            --card: #18181f;
            --border: #2a2a35;
            --accent: #7c6af7;
            --accent2: #a78bfa;
            --text: #f0eeff;
            --muted: #8884a8;
            --star: #f4c543;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* background glow */
        body::before {
            content: '';
            position: fixed;
            top: -200px;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(124, 106, 247, 0.15) 0%, transparent 70%);
            pointer-events: none;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 56px 64px;
            max-width: 570px;
            width: 90%;
            text-align: center;
            position: relative;
            animation: fadeUp 0.6s cubic-bezier(.22, 1, .36, 1) both;
        }

        html[dir="rtl"] .card {
            text-align: right;
        }

        html[dir="rtl"] #starsLink {
            unicode-bidi: bidi-override;
            direction: ltr;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(24px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icon {
            font-size: 52px;
            margin-bottom: 24px;
            display: block;
            animation: pop 0.5s 0.3s cubic-bezier(.34, 1.56, .64, 1) both;
        }

        @keyframes pop {
            from {
                transform: scale(0.5);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        h1 {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 36px;
            line-height: 1.2;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #fff 40%, var(--accent2));
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle-highlight {
            background: linear-gradient(135deg, #fff 30%, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 19px;
            font-weight: 600;
            display: block;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 17px;
            color: var(--muted);
            line-height: 1.6;
            margin-bottom: 36px;
        }

        .star.lit {
            filter: none;
            transform: scale(1.15);
        }

        .star:hover {
            transform: scale(1.25);
        }

        .btn {
            display: inline-block;
            padding: 16px 40px;
            border-radius: 100px;
            font-family: 'DM Sans', sans-serif;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            text-decoration: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #fff;
            box-shadow: 0 4px 24px rgba(124, 106, 247, 0.35);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(124, 106, 247, 0.5);
        }

        .btn-skip {
            display: block;
            margin-top: 16px;
            color: var(--muted);
            font-size: 14px;
            cursor: pointer;
            background: none;
            border: none;
            font-family: inherit;
            transition: color 0.2s;
        }

        .btn-skip:hover {
            color: var(--text);
        }

        .note {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
            font-size: 13px;
            color: var(--muted);
            line-height: 1.6;
        }

        .note strong {
            color: var(--text);
        }
    </style>
</head>

<body>

    <div class="card">
        <img src="icons/icon-128.png" style="width: 72px; height: 72px; border-radius: 16px; margin-bottom: 24px;" />
        <h1>Enjoying Mira Translator?</h1>
        <p class="subtitle">
            This is an open-source project I build and maintain solo — your support is what keeps me going. ✨
        </p>

        <a id="starsLink" href="#" target="_blank"
            style="text-decoration: none; display: block; font-size: 48px; margin-bottom: 36px; letter-spacing: 4px; cursor: pointer;">
            ⭐⭐⭐⭐⭐
        </a>

        <a id="reviewBtn" class="btn btn-primary" href="#" target="_blank">
            Rate Mira Translator⭐
        </a>


    </div>
    <script src="utils.js"></script>
    <script src="review.js"></script>

</body>

</html>
