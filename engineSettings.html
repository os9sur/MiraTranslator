<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <script src="i18n.js"></script>
    <title>Mira Translator</title>
    <link rel="stylesheet" href="notice.css">
    <link rel="stylesheet" href="engineSettings.css">
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="current-status-bar">
                <div data-i18n="currentActiveEngine" dir="auto" class="status-label">当前生效引擎</div>
                <div id="active-engine-name" dir="auto" class="status-value"></div>
            </div>
            <div data-i18n="engineListTitle" dir="auto" class="sidebar-header">引擎列表</div>
            <div class="scroll-area" id="engine-sidebar-list"></div>
            <div class="sidebar-footer">
                <div class="cache-status-panel">
                    <div class="cache-label">
                        <span data-i18n="cacheTitle">缓存</span>
                        <b id="cache-size">0.00 MB</b>
                    </div>
                    <button data-i18n="clearBtn" id="clear-cache-btn" class="text-link-btn">清除</button>
                </div>
                <button data-i18n="addTranslationService" dir="auto" class="btn-add-trigger" style="min-height: 52px;"
                    id="add-new-config">
                    + 添加自定义翻译服务（API Key）
                </button>
            </div>
        </aside>
        <main class="main-content">
            <div id="close-engineSettingsWindow" class="close-btn" title=""></div>
            <!-- 通知栏 -->
            <div id="noticeBar" class="notice-bar" style="display:none;width:97%;border-radius: 19px;">
                <!-- 折叠行：默认是手型 cursor: pointer -->
                <div id="noticeCollapsedRow" dir="auto" class="mira-pulsing"
                    style="cursor: pointer; display: flex; align-items: center;">
                    <span style="width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:8px;"></span>
                    <div
                        style="width: 6px; height: 6px; border-radius: 50%; background: rgb(34, 197, 94); flex-shrink: 0; animation: 1.8s ease-in-out 0s infinite normal none running miraDotBlink;">
                    </div>
                    <span id="noticeTitleClip" class="notice-title-clip"></span>
                    <div id="noticeChevron" style="
            flex-shrink: 0; color: rgb(70 235 179);
            font-size: 10px; transition: transform 0.25s ease;
            ">&#9660;</div>
                </div>

                <!-- 展开后的正文体  -->
                <div id="noticeExpandedBody" dir="auto">
                    <div id="noticeContentText" class="notice-content-text"
                        style="user-select: text; -webkit-user-select: text; cursor: text;"></div>
                    <button id="noticeGotItBtn" style="cursor: pointer;"></button>
                </div>
            </div>

            <div id="dynamic-form-container"></div>
            <div class="bottom-bar hidden" id="global-actions">
                <div id="tips" style="font-size: 12px; margin-bottom: 8px; min-height: 18px;"></div>
                <div class="button-group">
                    <button data-i18n="testConnection" class="btn-test" id="testApiConfig">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="rgb(0 255 73)"
                            style="margin-right:6px;flex-shrink:0;">
                            <path d="M13 2 3 14h7l-1 8 10-12h-7z" />
                        </svg>
                        测试连接
                    </button>
                    <button data-i18n="save" class="btn-save" id="saveApiConfig">应用并保存</button>
                    <button data-i18n="enableEngineNow" class="btn-enable" id="enableCurrentEngine">立即启用此引擎</button>
                </div>
            </div>
            <div class="credit-text">
                Created by David Bai
            </div>
        </main>
    </div>
    <div id="engine-modal" class="modal-overlay hidden">
        <div dir="auto" class="modal-content">
            <div id="close-modal" class="close-btn" title=""></div>
            <div class="header-area">
                <h2 data-i18n="addTranslationService">添加翻译模板</h2>
                <p data-i18n="initEngineTip" style="color: var(--text-dim); font-size: 13px; margin: 8px 0 0 0;">
                    请选择要初始化的引擎实例</p>
            </div>
            <div id="template-grid" class="template-grid"> </div>
        </div>
    </div>

    <script src="utils.js"></script>
    <script src="notice.js"></script>
    <script src="engineSettings.js"></script>
</body>

</html>
