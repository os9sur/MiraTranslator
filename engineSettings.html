<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <script src="i18n.js"></script>
    <script src="constants.js"></script>
    <title>Mira Translator</title>
    <link rel="stylesheet" href="engineSettings.css">
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="current-status-bar">
                <div data-i18n="currentActiveEngine" dir="auto" class="status-label">当前生效引擎</div>
                <div id="active-engine-name" dir="auto" class="status-value"></div>
            </div>
            <div data-i18n="engineListTitle" dir="auto" class="sidebar-header">引擎列表</div>
            <div class="scroll-area" id="engine-sidebar-list"></div>
            <div class="sidebar-footer">
                <div class="cache-status-panel">
                    <div class="cache-label">
                        <span data-i18n="cacheTitle">缓存</span>
                        <b id="cache-size">0.00 MB</b>
                    </div>
                    <button data-i18n="clearBtn" id="clear-cache-btn" class="text-link-btn">清除</button>
                </div>
                <button data-i18n="addTranslationService" dir="auto" class="btn-add-trigger"
                    style="min-height: 52px;border-radius:9px !important;" id="add-new-config">
                    + 添加自定义翻译服务（API Key）
                </button>
            </div>
        </aside>
        <main class="main-content">
            <div id="close-engineSettingsWindow" class="close-btn" title=""></div>
            <div id="dynamic-form-container"></div>
            <div class="bottom-bar hidden" id="global-actions">
                <div id="tips" style="font-size: 12px; margin-bottom: 8px; min-height: 18px;"></div>
                <div class="button-group">
                    <button data-i18n="testConnection" class="btn-test" id="testApiConfig">⚡ 测试连接</button>
                    <button data-i18n="save" class="btn-save" id="saveApiConfig">应用并保存</button>
                </div>
            </div>
        </main>
    </div>
    <div id="engine-modal" class="modal-overlay hidden">
        <div dir="auto" class="modal-content">
            <div id="close-modal" class="close-btn" title=""></div>
            <div class="header-area">
                <h2 data-i18n="addTranslationService">添加翻译模板</h2>
                <p data-i18n="initEngineTip" style="color: var(--text-dim); font-size: 13px; margin: 8px 0 0 0;">
                    请选择要初始化的引擎实例</p>
            </div>
            <div id="template-grid"  class="template-grid"> </div>
        </div>
    </div>
    <!-- 遮罩层 -->
    <div id="loginModalBackdrop"
        style="display:none; position:fixed; inset:0; z-index:9998; background:rgba(0,0,0,0.6); backdrop-filter:blur(4px);">
    </div>

    <div id="loginModal">

        <!-- 头像区域（登录后显示） -->
        <div id="modalUserInfo" style="display:none; text-align:center; margin-bottom:20px;">
            <div style="display:flex; justify-content:center; margin-bottom:10px;">
                <div
                    style="width:56px;height:56px;border-radius:50%;border:2px solid #58f1ff;overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 0 12px rgba(88,241,255,0.6);animation:avatar-glow 2s infinite ease-in-out;">
                    <img id="modalAvatarImg" src=""
                        style="width:100%;height:100%;object-fit:cover;border-radius:50%;display:none;">
                    <span id="modalAvatarInitial" style="color:#fff;font-size:22px;font-weight:bold;"></span>
                </div>
            </div>
            <div id="modalUserName" style="font-size:14px;font-weight:600;color:#fff;margin-bottom:4px;"></div>
            <div id="modalUserEmail" style="font-size:12px;color:#94a3b8;"></div>
        </div>

        <!-- 未登录时显示 -->
        <div id="modalLoginPrompt" style="margin-bottom: 26px;">
            <p style="margin:0 0 4px; font-size:15px; font-weight:700; color:#fff;" data-i18n="login">登录账号</p>
            <!-- <p style="margin:0 0 16px; font-size:12px; color:#94a3b8;">同步你的翻译偏好</p> -->
        </div>

        <button id="btnGoogleLogin" class="auth-provider-btn">
            <svg width="14" height="14" viewBox="0 0 18 18">
                <path fill="#4285F4"
                    d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.716v2.259h2.908C16.658 14.095 17.64 11.787 17.64 9.2z" />
                <path fill="#34A853"
                    d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" />
                <path fill="#FBBC05"
                    d="M3.964 10.706A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.706V4.962H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.038l3.007-2.332z" />
                <path fill="#EA4335"
                    d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.962L3.964 7.294C4.672 5.163 6.656 3.58 9 3.58z" />
            </svg>
            Google
        </button>
        <button id="btnMicrosoftLogin" class="auth-provider-btn">
            <svg width="14" height="14" viewBox="0 0 21 21">
                <rect x="1" y="1" width="9" height="9" fill="#F25022" />
                <rect x="11" y="1" width="9" height="9" fill="#7FBA00" />
                <rect x="11" y="11" width="9" height="9" fill="#FFB900" />
                <rect x="1" y="11" width="9" height="9" fill="#00A4EF" />
            </svg>
            Microsoft
        </button>
    </div>

    <script src="utils.js"></script>
    <script src="engineSettings.js"></script>
</body>

</html>
